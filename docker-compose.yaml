services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cc-fastapi-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    environment:
      DATABASE_URL: "sqlite:///./data/cc_fastapi.db"
      POSTGRES_EXTERNAL_URL: "${POSTGRES_EXTERNAL_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_DIR: "${LOG_DIR:-logs}"
      DEBUG_LOG_ENABLED: "${DEBUG_LOG_ENABLED:-true}"
      DEBUG_LOG_BACKUP_DAYS: "${DEBUG_LOG_BACKUP_DAYS:-14}"
      DEBUG_LOG_FILENAME: "${DEBUG_LOG_FILENAME:-debug.log}"
      DEBUG_LOG_UTC: "${DEBUG_LOG_UTC:-true}"
      QUEUES_CONFIG_PATH: "${QUEUES_CONFIG_PATH:-config/queues.yaml}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-1000}"
      QUEUE_TTL_HOURS: "${QUEUE_TTL_HOURS:-24}"
      RUNNING_TTL_HOURS: "${RUNNING_TTL_HOURS:-4}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-3}"
      CLAUDE_PERMISSION_MODE: "${CLAUDE_PERMISSION_MODE:-bypassPermissions}"
      CLAUDE_MAX_TURNS: "${CLAUDE_MAX_TURNS:-16}"
      CLAUDE_CWD: "${CLAUDE_CWD:-.}"
      CLAUDE_ALLOWED_TOOLS: "${CLAUDE_ALLOWED_TOOLS:-}"
      CLAUDE_DISALLOWED_TOOLS: "${CLAUDE_DISALLOWED_TOOLS:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      API_TIMEOUT_MS: "${API_TIMEOUT_MS:-3000000}"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "${ANTHROPIC_DEFAULT_OPUS_MODEL:-}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}"
      API_TOKEN: "${API_TOKEN:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_CLIENT_AUTH_METHOD: "${OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_SIGNING_ALGORITHMS: "${OIDC_SIGNING_ALGORITHMS:-RS256}"
      OIDC_SESSION_SECRET: "${OIDC_SESSION_SECRET:-}"
      OIDC_SESSION_HOURS: "${OIDC_SESSION_HOURS:-12}"
      OIDC_COOKIE_SECURE: "${OIDC_COOKIE_SECURE:-false}"
      OIDC_USERNAME_CLAIM: "${OIDC_USERNAME_CLAIM:-preferred_username}"
      OIDC_DISPLAY_NAME_CLAIM: "${OIDC_DISPLAY_NAME_CLAIM:-name}"
      OIDC_EMAIL_CLAIM: "${OIDC_EMAIL_CLAIM:-email}"
      OIDC_BUTTON_LABEL: "${OIDC_BUTTON_LABEL:-使用企业账号登录}"
      OIDC_TIMEOUT_SECONDS: "${OIDC_TIMEOUT_SECONDS:-10}"
      REVIEW_CONSOLE_API_TOKEN: "${REVIEW_CONSOLE_API_TOKEN:-}"
      GITLAB_WEBHOOK_SECRET: "${GITLAB_WEBHOOK_SECRET:-}"
      GITLAB_WEBHOOK_PROMPT_TEMPLATE_PATH: "${GITLAB_WEBHOOK_PROMPT_TEMPLATE_PATH:-}"
      GITLAB_WEBHOOK_QUEUE_NAME: "${GITLAB_WEBHOOK_QUEUE_NAME:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      GITHUB_WEBHOOK_PROMPT_TEMPLATE_PATH: "${GITHUB_WEBHOOK_PROMPT_TEMPLATE_PATH:-}"
      GITHUB_WEBHOOK_QUEUE_NAME: "${GITHUB_WEBHOOK_QUEUE_NAME:-}"
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc-agent-console
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-18080}:80"
    depends_on:
      - app
    restart: unless-stopped

  review-console-api:
    profiles: ["review-console"]
    build:
      context: ./review-console/backend
    container_name: cc-review-console-api
    environment:
      REVIEW_CONSOLE_DATABASE_URL: "sqlite:///./data/review_console.db"
      REVIEW_API_URL: "http://app:8000"
      REVIEW_CONSOLE_API_TOKEN: "${REVIEW_CONSOLE_API_TOKEN:-}"
      REVIEW_CONSOLE_SESSION_SECRET: "${REVIEW_CONSOLE_SESSION_SECRET:-}"
      REVIEW_CONSOLE_SESSION_HOURS: "${REVIEW_CONSOLE_SESSION_HOURS:-12}"
      REVIEW_CONSOLE_COOKIE_SECURE: "${REVIEW_CONSOLE_COOKIE_SECURE:-false}"
      REVIEW_CONSOLE_ADMIN_USERNAME: "${REVIEW_CONSOLE_ADMIN_USERNAME:-admin}"
      REVIEW_CONSOLE_ADMIN_PASSWORD: "${REVIEW_CONSOLE_ADMIN_PASSWORD:-}"
      REVIEW_CONSOLE_LOCAL_LOGIN_ENABLED: "${REVIEW_CONSOLE_LOCAL_LOGIN_ENABLED:-true}"
      REVIEW_CONSOLE_SSO_ENABLED: "${REVIEW_CONSOLE_SSO_ENABLED:-false}"
      REVIEW_CONSOLE_OAUTH_BEARER_ENABLED: "${REVIEW_CONSOLE_OAUTH_BEARER_ENABLED:-false}"
      REVIEW_CONSOLE_OAUTH_AUDIENCE: "${REVIEW_CONSOLE_OAUTH_AUDIENCE:-}"
      REVIEW_CONSOLE_OAUTH_TOKEN_TYPE: "${REVIEW_CONSOLE_OAUTH_TOKEN_TYPE:-at+jwt}"
      REVIEW_CONSOLE_SSO_ISSUER_URL: "${REVIEW_CONSOLE_SSO_ISSUER_URL:-}"
      REVIEW_CONSOLE_SSO_CLIENT_ID: "${REVIEW_CONSOLE_SSO_CLIENT_ID:-}"
      REVIEW_CONSOLE_SSO_CLIENT_SECRET: "${REVIEW_CONSOLE_SSO_CLIENT_SECRET:-}"
      REVIEW_CONSOLE_SSO_CLIENT_AUTH_METHOD: "${REVIEW_CONSOLE_SSO_CLIENT_AUTH_METHOD:-client_secret_basic}"
      REVIEW_CONSOLE_SSO_REDIRECT_URI: "${REVIEW_CONSOLE_SSO_REDIRECT_URI:-}"
      REVIEW_CONSOLE_SSO_SCOPES: "${REVIEW_CONSOLE_SSO_SCOPES:-openid profile email}"
      REVIEW_CONSOLE_SSO_SIGNING_ALGORITHMS: "${REVIEW_CONSOLE_SSO_SIGNING_ALGORITHMS:-RS256}"
      REVIEW_CONSOLE_SSO_USERNAME_CLAIM: "${REVIEW_CONSOLE_SSO_USERNAME_CLAIM:-preferred_username}"
      REVIEW_CONSOLE_SSO_DISPLAY_NAME_CLAIM: "${REVIEW_CONSOLE_SSO_DISPLAY_NAME_CLAIM:-name}"
      REVIEW_CONSOLE_SSO_GROUPS_CLAIM: "${REVIEW_CONSOLE_SSO_GROUPS_CLAIM:-groups}"
      REVIEW_CONSOLE_SSO_ADMIN_GROUP: "${REVIEW_CONSOLE_SSO_ADMIN_GROUP:-}"
      REVIEW_CONSOLE_SSO_BUTTON_LABEL: "${REVIEW_CONSOLE_SSO_BUTTON_LABEL:-使用企业账号登录}"
      REVIEW_CONSOLE_SSO_TIMEOUT_SECONDS: "${REVIEW_CONSOLE_SSO_TIMEOUT_SECONDS:-10}"
    volumes:
      - review_console_data:/app/data
    depends_on:
      - app
    restart: unless-stopped

  review-console-frontend:
    profiles: ["review-console"]
    build:
      context: ./review-console/frontend
    container_name: cc-review-console
    ports:
      - "${REVIEW_CONSOLE_HOST:-0.0.0.0}:${REVIEW_CONSOLE_PORT:-18090}:80"
    depends_on:
      - review-console-api
    restart: unless-stopped

volumes:
  app_data:
  review_console_data:
